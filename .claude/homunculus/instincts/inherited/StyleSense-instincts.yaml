# StyleSense Workflow Instrument Or Swap Analytics Or Error Monitoring

## Action

Follow the instrument-or-swap-analytics-or-error-monitoring workflow:
1. Update or replace instrumentation entry points (e.g., instrumentation.ts, instrumentation-client.ts).
2. Update or remove provider-specific config files (e.g., sentry.edge.config.ts, sentry.server.config.ts).
3. Update package.json and package-lock.json to add/remove dependencies.
4. Update environment variable examples (.env.example) as needed.
5. Update backend middleware or service files for analytics/error tracking.
6. Update frontend global error boundaries or analytics providers.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: frontend/instrumentation.ts, frontend/instrumentation-client.ts, frontend/app/global-error.tsx

