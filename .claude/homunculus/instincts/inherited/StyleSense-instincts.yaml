# StyleSense Workflow Add Or Update Usage Cap Or Meter

## Action

Follow the add-or-update-usage-cap-or-meter workflow:
1. Update backend logic to enforce or modify usage caps (e.g., usage_limits.py, tryon.py).
2. Update or create database schema/migration files for new tracking (e.g., aurora_schema.sql, migration files).
3. Update frontend components to display usage (e.g., UsageMeter.tsx, dashboard/page.tsx).
4. Add or update tests for usage limits (e.g., test_usage_scalability.py).
5. Optionally, instrument analytics or notifications (e.g., analytics_service.py, email_service.py).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: backend/services/usage_limits.py, backend/routers/tryon.py, backend/aurora_schema.sql

