name: E2E against Vercel preview

# Vercel's GitHub integration posts a `deployment_status` event once a
# preview build finishes, with the live preview URL in
# `deployment_status.target_url`. Run the Playwright suite against that URL
# instead of a local dev server -- catches regressions on the actual deployed
# preview before anyone runs `vercel promote` to production (this project's
# Vercel setup does not auto-promote on push, see docs/manual-test-checklist.md).
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   E2E_TEST_EMAIL + E2E_TEST_PASSWORD  (preferred)
#   — or TEST_USER_EMAIL + TEST_USER_PASSWORD (same seed QA account; see AGENTS.md)
# The preview's backend target (NEXT_PUBLIC_API_URL) is whatever Vercel's
# Preview environment variables point at -- normally the same always-on
# Render backend used by production, so no backend to spin up here.

on:
  deployment_status: {}

jobs:
  e2e:
    # Guards against a malicious fork PR getting Vercel to build/deploy attacker
    # code, then having this job hand real E2E_TEST_EMAIL/PASSWORD secrets to
    # whatever page loads at target_url (e.g. a fake login form that exfiltrates
    # them). repository_owner check confirms the deployment belongs to this repo
    # (not a fork's copy of the workflow); the target_url regex confirms Playwright
    # only ever navigates to a URL on this project's own Vercel domain.
    #
    # This does NOT by itself guarantee target_url's *content* is trustworthy if
    # your Vercel project is configured to auto-build fork PRs -- verify in Vercel
    # dashboard -> Project Settings -> Git that fork PR deployments are disabled
    # (default for most projects). If you need fork PR previews for other reasons,
    # move this job behind a GitHub Environment with required reviewers instead.
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      github.repository_owner == github.event.repository.owner.login &&
      startsWith(github.event.deployment_status.target_url, 'https://') &&
      endsWith(github.event.deployment_status.target_url, '.vercel.app')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          export E2E_TEST_EMAIL="${E2E_TEST_EMAIL:-$TEST_USER_EMAIL}"
          export E2E_TEST_PASSWORD="${E2E_TEST_PASSWORD:-$TEST_USER_PASSWORD}"
          if [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "::error title=E2E credentials missing::Add E2E_TEST_EMAIL and E2E_TEST_PASSWORD (or TEST_USER_EMAIL and TEST_USER_PASSWORD) under Settings → Secrets and variables → Actions. Use the ellbit seed account with wardrobe data — see AGENTS.md."
            exit 1
          fi
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
